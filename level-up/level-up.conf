# BTG level-up loop — settings. Sourced by run.sh (bash syntax).
# An environment variable of the same name overrides each value
# (e.g. LEVELUP_MODEL=sonnet ./run.sh --dry-run).

# Model for every agent. opus-class or cheaper. run.sh REFUSES "fable" (ZEN 11-02: token cost).
MODEL="${LEVELUP_MODEL:-opus}"
# Used by the CLI only when MODEL is overloaded. Empty = no fallback.
FALLBACK_MODEL="${LEVELUP_FALLBACK_MODEL:-sonnet}"

# Headless permission mode. "auto" = the CLI's safety classifier decides each action
# (this is ZEN's default mode). DENY lists in run.sh add a hard backstop on top.
PERMISSION_MODE="${LEVELUP_PERMISSION_MODE:-auto}"

CLAUDE_BIN="${LEVELUP_CLAUDE_BIN:-/home/dean/.local/bin/claude}"

# Where run folders go: <REVIEWS_ROOT>/level-up-<YYYY-MM-DD>/
REVIEWS_ROOT="${LEVELUP_REVIEWS_ROOT:-/home/dean/btg/reviews}"
# Lock + run ledger (on disk, never /tmp).
STATE_DIR="${LEVELUP_STATE_DIR:-/home/dean/.local/state/btg-level-up}"
# Used as "previous review" when no earlier level-up run exists.
PREV_REVIEW_SEED="${LEVELUP_PREV_REVIEW_SEED:-/home/dean/btg/reviews/vision-level-up-2026-11-09/REVIEW.md}"

# Reviewer order (serial, one at a time; the box is shared).
LENSES="${LEVELUP_LENSES:-technical visual competitive engine zed-render systems data}"
# Merge runs only when at least this many lenses finished.
MIN_LENSES="${LEVELUP_MIN_LENSES:-5}"

# Skip the run (and stop between agents) when the 1-minute load average is above this.
# Host has 32 cores.
MAX_LOAD1="${LEVELUP_MAX_LOAD1:-24}"
# How long to wait (minutes, checking every 5) for the load to drop before giving up. 0 = give up at once.
LOAD_WAIT_MIN="${LEVELUP_LOAD_WAIT_MIN:-120}"

# Hard wall-clock limit per agent (GNU timeout syntax). SIGTERM, then SIGKILL 60 s later,
# to that agent's own process only.
REVIEWER_TIMEOUT="${LEVELUP_REVIEWER_TIMEOUT:-75m}"
MERGE_TIMEOUT="${LEVELUP_MERGE_TIMEOUT:-60m}"
BUILDER_TIMEOUT="${LEVELUP_BUILDER_TIMEOUT:-120m}"

# Cost caps in USD, as the CLI reports them (total_cost_usd). On a subscription login this
# is the CLI's own estimate, not a bill. Per agent = --max-budget-usd. Per run = run.sh sums
# each agent's reported cost and starts no new agent once the sum reaches RUN_BUDGET_USD;
# each agent's cap is also cut to what is left of the run budget.
# These defaults are CAPS, not estimates. ZEN rules the real numbers.
REVIEWER_BUDGET_USD="${LEVELUP_REVIEWER_BUDGET_USD:-15}"
MERGE_BUDGET_USD="${LEVELUP_MERGE_BUDGET_USD:-15}"
BUILDER_BUDGET_USD="${LEVELUP_BUILDER_BUDGET_USD:-20}"
RUN_BUDGET_USD="${LEVELUP_RUN_BUDGET_USD:-120}"

# --build only: max builder agents per run, and the repos a builder may branch from.
MAX_BUILDERS="${LEVELUP_MAX_BUILDERS:-2}"
# A repo must have an "origin" remote (for the draft PR); run.sh skips a lane whose repo does not.
BUILD_REPOS="${LEVELUP_BUILD_REPOS:-/home/dean/btg/BTG-Rebuild /home/dean/btg/BTG-Native-Chart-Engine}"
WORKTREE_ROOT="${LEVELUP_WORKTREE_ROOT:-/home/dean/btg/wt}"

# --notify only: the existing send-only Telegram script (one sendMessage, no getUpdates).
NOTIFY_BIN="${LEVELUP_NOTIFY_BIN:-/home/dean/btg/ops/tg-text.sh}"

# Prod build probe (GET only).
READY_URL="${LEVELUP_READY_URL:-http://127.0.0.1:3020/api/ready}"
