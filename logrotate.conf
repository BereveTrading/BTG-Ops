# Rotation for the long-lived ops logs.
#
# Run by btg-ops-housekeeping.service (a --user timer), so this never needs
# root and never lands in /etc/logrotate.d.
#
# copytruncate everywhere: ingestd.log has live writers holding open fds, and
# all of them opened it O_APPEND (verified 2026-08-17), so truncating in place
# is safe and leaves no sparse hole. Renaming instead would leave the writers
# appending to an unlinked inode forever.

compress
compresscmd /usr/bin/gzip
compressoptions -6
notifempty
missingok
nomail
su dean dean

# The ingest daemon. Reached 553M unrotated before 2026-08-17.
/home/dean/btg/ops/ingestd.log {
    daily
    rotate 14
    size 100M
    copytruncate
    olddir /home/dean/btg/ops/log-archive
    createolddir
}

# Production session-order worker. One append per minute; no persistent writer,
# but copytruncate is still the safe choice against a run landing mid-rotate.
/home/dean/btg/ops/discord-production-session-order/worker.log {
    weekly
    rotate 8
    size 50M
    copytruncate
    olddir /home/dean/btg/ops/log-archive
    createolddir
}

# Gateway-divergence detector. One JSON line per run at 144 runs/day — small,
# but it is the only record that the check actually ran, so it is kept a long
# time rather than trimmed aggressively.
/home/dean/btg/ops/gateway-divergence-watch/watch.jsonl {
    monthly
    rotate 12
    size 20M
    copytruncate
    olddir /home/dean/btg/ops/log-archive
    createolddir
}
